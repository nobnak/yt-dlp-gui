name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore yt-dlp-gui.sln

      - name: Publish application
        run: >
          dotnet publish yt-dlp-gui/yt-dlp-gui.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=false
          -o publish

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { "latest" }
          $zipName = "yt-dlp-gui-$tag-win-x64.zip"
          
          # Copy language definitions next to executable
          Copy-Item -Path "languages" -Destination "publish\languages" -Recurse -Force
          
          # Compress to zip
          Compress-Archive -Path "publish\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ${{ env.ZIP_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ github.token }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
